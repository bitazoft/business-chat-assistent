# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Admin-Portal/backend/**'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
    
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Admin-Portal/backend 
          push: true
          tags: |
                mksiri/chatbot-client-backend:${{ env.SHORT_SHA }}
                mksiri/chatbot-client-backend:latest
          build-args: |
                PORT=${{ secrets.PORT }}
                DATABASE_URL=${{ secrets.DATABASE_URL }}
                JWT_SECRET=${{ secrets.JWT_SECRET }}
                NODE_ENV=${{ secrets.NODE_ENV }}
                AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
                AWS_ACCESSKEYID=${{ secrets.AWS_ACCESSKEYID }}
                AWS_SECRETACCESSKEY=${{ secrets.AWS_SECRETACCESSKEY }}
                AWS_REGION=${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-client-backend:latest
            docker stop chatbot-client-backend || true && docker rm chatbot-client-backend || true
            docker run -d --name myapp -p 7001:7001 ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-client-backend:latest
